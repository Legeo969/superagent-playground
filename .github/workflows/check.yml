name: check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check value
        run: |
          value="$(cat value.txt | tr -d '[:space:]')"
          echo "value=$value"
          if [ "$value" != "ok" ]; then
            echo "::error::value.txt must contain ok but contains $value"
            exit 1
          fi